# Minimal Black - Ghostty colors + window transparency.
# Palette copied from the generated template output; keep in sync with colors.toml.

background = #000000
foreground = #e7e9ea
cursor-color = #e7e9ea
selection-background = #e7e9ea
selection-foreground = #000000

palette = 0=#000000
palette = 1=#8a8a8a
palette = 2=#e7e9ea
palette = 3=#9e9e9e
palette = 4=#626262
palette = 5=#8a8a8a
palette = 6=#767676
palette = 7=#e7e9ea
palette = 8=#4d4d4d
palette = 9=#9e9e9e
palette = 10=#767676
palette = 11=#b2b2b2
palette = 12=#9e9e9e
palette = 13=#8a8a8a
palette = 14=#9e9e9e
palette = 15=#e7e9ea

# Glass: see-through background (text stays crisp). Hyprland only blurs a GTK
# app behind a CSS backdrop-filter, which Omarchy's glass.css provides.
background-opacity = 0.85
gtk-custom-css = /usr/share/omarchy/default/gtk/glass.css
