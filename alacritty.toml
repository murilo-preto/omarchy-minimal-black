# Minimal Black - Alacritty colors + window transparency.
#
# Shipping this file means Omarchy's alacritty.toml.tpl is skipped for this
# theme, so the palette below is a manual copy of colors.toml - keep the two
# in sync. In exchange, terminal alpha is scoped to this theme instead of
# living in ~/.config/alacritty/alacritty.toml for every theme.
#
# Like hyprland.lua, this is staged only for a hand-written or symlinked
# theme directory, never for one installed from a git repo.

[window]
opacity = 0.85

[colors.primary]
background = "#000000"
foreground = "#e7e9ea"

[colors.cursor]
text = "#000000"
cursor = "#e7e9ea"

[colors.vi_mode_cursor]
text = "#000000"
cursor = "#e7e9ea"

[colors.search.matches]
foreground = "#000000"
background = "#9e9e9e"

[colors.search.focused_match]
foreground = "#000000"
background = "#8a8a8a"

[colors.footer_bar]
foreground = "#000000"
background = "#e7e9ea"

[colors.selection]
text = "#000000"
background = "#e7e9ea"

[colors.normal]
black = "#000000"
red = "#8a8a8a"
green = "#e7e9ea"
yellow = "#9e9e9e"
blue = "#626262"
magenta = "#8a8a8a"
cyan = "#767676"
white = "#e7e9ea"

[colors.bright]
black = "#4d4d4d"
red = "#9e9e9e"
green = "#767676"
yellow = "#b2b2b2"
blue = "#9e9e9e"
magenta = "#8a8a8a"
cyan = "#9e9e9e"
white = "#e7e9ea"
