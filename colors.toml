mode = "dark"

accent = "#626262"          # UI accent: links, focused controls, active states, lock glyph
selection = "#262626"       # UI selection fills (btop meter, editor selection tint)
muted = "#626262"           # Dim text, inactive UI, subtle borders

background = "#000000"      # Default background for terminals and themed UI surfaces
dark_background = "#0d0d0d" # Deeper canvas
darker_background = "#060606"
lighter_background = "#1a1a1a"

foreground = "#e7e9ea"      # Primary text color used across Omarchy templates
dark_foreground = "#626262" # Muted text
light_foreground = "#e0e0e0"
bright_foreground = "#e7e9ea"

# Monochrome ANSI palette with a soft peach accent.
red = "#8a8a8a"
yellow = "#9e9e9e"
orange = "#ff8852"
green = "#e7e9ea"
cyan = "#767676"
blue = "#626262"
magenta = "#8a8a8a"
brown = "#804429"

bright_red = "#9e9e9e"
bright_yellow = "#b2b2b2"
bright_green = "#767676"
bright_cyan = "#9e9e9e"
bright_blue = "#626262"
bright_magenta = "#8a8a8a"

# High-contrast inverted terminal selection (white on black).
selection_background = "#e7e9ea"
selection_foreground = "#000000"
